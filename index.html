<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<title>Rolex Calculator</title>

<style>
:root{
  --bg:#F6F5F1; --card:#fff; --line:#E6E3DA; --txt:#16201A; --mut:#7A8378;
  --grn:#0B5C3F; --grnbg:#EDF4F0; --gold:#B08D3E; --red:#A34A3C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  padding:16px 12px calc(30px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
}
.wrap{max-width:480px;margin:0 auto}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;background:var(--card);border:1.5px solid var(--line);color:var(--txt);
  border-radius:12px;padding:12px 13px;font-size:16px;width:100%;outline:none;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus{border-color:var(--grn)}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;text-align:left}

/* الهيدر */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.title{font-size:19px;font-weight:700;color:var(--grn)}
.btn-o{padding:8px 16px;border-radius:10px;font-size:13.5px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--grn)}
.btn-o:disabled{color:var(--line)}

/* زر الساعة */
.watch{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:13px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.watch .fam{font-size:11.5px;color:var(--mut);margin-bottom:2px}
.watch .nm{font-size:17px;font-weight:700}
.watch .rf{font-size:12px;color:var(--mut);direction:ltr;text-align:left}
.watch .go{color:var(--grn);font-size:13px;font-weight:700;flex-shrink:0}

/* بطاقة النتيجة */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px;margin-top:10px;text-align:center}
.chip{background:var(--bg);border:1.5px dashed var(--line);border-radius:999px;padding:6px 16px;font-size:13px;color:var(--mut)}
.chip.warn{border-color:var(--gold);color:var(--gold);font-weight:700}
.big{font-size:52px;font-weight:700;color:var(--grn);line-height:1;margin-top:10px}
.sub{font-size:14px;color:var(--mut);margin-top:3px}
.note{font-size:11.5px;color:var(--gold);margin-top:6px}
.buy{width:100%;height:100%;box-sizing:border-box;background:var(--grnbg);border-radius:12px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center}
.buyslot{height:44px;margin-top:12px;display:flex;align-items:center;justify-content:center}
.altslot{height:33px;margin-top:8px;display:flex;align-items:center;justify-content:center}
.hint{font-size:12.5px;color:var(--gold);font-weight:600;text-align:center;line-height:1.3}
.metarow{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:12px;color:var(--mut);margin-top:3px}
.metarow span{white-space:nowrap}
.buy span:first-child{font-size:12.5px;color:var(--grn)}
.buy span:last-child{font-size:17px;font-weight:700;color:var(--grn)}
.row2{display:flex;gap:8px;margin-top:10px}
.btn-p{flex:1;background:var(--card);color:var(--grn);border:1.5px solid var(--grn);border-radius:12px;padding:10px 0;font-size:14.5px;font-weight:700}
.btn-p.on{background:var(--grn);color:#fff}
.btn-s{flex:1;background:var(--card);color:var(--mut);border:1.5px solid var(--line);border-radius:12px;padding:10px 0;font-size:14.5px;font-weight:600}

/* السنوات */
.ylab{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 7px;font-size:12.5px;color:var(--mut)}
.ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.y{padding:11px 0;border-radius:11px;font-size:15px;border:1.5px solid var(--line);background:var(--card);font-variant-numeric:tabular-nums}
.y.on{background:var(--grn);color:#fff;border-color:var(--grn);font-weight:700}

/* الكيباد */
.pad{background:#D1D3D9;border-radius:14px;padding:8px;margin-top:14px;direction:ltr}
.pad .g{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.k{height:56px;border-radius:8px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111}
.k.plain{background:transparent;box-shadow:none}
.k:active{background:#E6E7EB}
.k.plain:active{background:rgba(0,0,0,.07)}
.k b{font-size:25px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.k i{font-size:9px;letter-spacing:1.4px;color:#6D6D72;font-weight:600;font-style:normal;margin-top:2px}
.link{width:100%;padding:9px 0;font-size:13px;color:var(--mut);margin-top:6px}

/* الشيتات */
.mask{position:fixed;inset:0;background:rgba(12,20,16,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column}
.sh-top{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.sh-top b{font-size:16px;color:var(--grn)}
.x{background:var(--bg);border-radius:999px;width:30px;height:30px;font-size:17px;color:var(--mut)}
.sh-body{overflow-y:auto;padding:14px;flex:1;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.sh-foot{padding:12px;border-top:1px solid var(--line);flex-shrink:0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}

/* القوائم */
.grp{font-size:12.5px;font-weight:700;color:var(--grn);margin:14px 0 6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--card);width:100%;text-align:left;margin-bottom:5px}
.opt.on{border-color:var(--grn);background:var(--grnbg)}
.opt .n{font-size:14.5px;font-weight:600;display:block}
.opt .r{font-size:11.5px;color:var(--mut);direction:ltr;display:block;text-align:left}
.opt .p{font-size:12.5px;color:var(--grn);flex-shrink:0;font-variant-numeric:tabular-nums}

/* الإعدادات */
.lbl{font-size:11.5px;color:var(--mut);margin-bottom:4px;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.sec{font-size:12.5px;font-weight:700;color:var(--grn);margin:16px 0 8px}
.bar{border-radius:11px;padding:8px 12px;font-size:11.5px;text-align:center;background:var(--bg);border:1.5px solid var(--line);color:var(--mut)}
.bar.bad{background:#FBEDEA;border-color:var(--red);color:var(--red)}
.bar.warn{background:#FBF4E4;border-color:var(--gold);color:var(--gold);font-weight:700;font-size:12.5px}
.save{width:100%;border-radius:12px;padding:14px 0;font-size:15.5px;font-weight:700;background:#C9CEC8;color:#fff}
.save.on{background:var(--grn)}
.save.ok{background:#1F7A55}
.small{font-size:11.5px;color:var(--mut);text-align:center;margin-top:10px}
.mini{padding:11px 0;border-radius:11px;font-size:13.5px;font-weight:700;border:1.5px solid var(--grn);background:var(--card);color:var(--grn);flex:1}

/* ملء الشاشة */
.full{position:fixed;inset:0;background:var(--grn);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:70;padding:20px;color:#fff}
.full .t1{color:#CFE3D8;font-size:17px;font-weight:600;text-align:center}
.full .t2{color:#CFE3D8;font-size:15px;margin-top:4px}
.full .n{font-size:19vw;font-weight:700;line-height:1.05;margin-top:12px;font-variant-numeric:tabular-nums}
.full .t3{color:#CFE3D8;font-size:21px;font-weight:600}

/* شريط العائلات والرفرنسات */
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.f{flex:0 0 auto;padding:9px 15px;border-radius:11px;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--txt)}
.f.on{background:var(--grn);color:#fff;border-color:var(--grn)}
.bstrip{margin-bottom:6px}
.f.b{font-size:15px;padding:8px 20px}
.f.add{border-style:dashed;color:var(--grn);font-weight:600}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.i{padding:9px 5px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);
   display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;min-height:56px}
.i.on{border-color:var(--grn);background:var(--grnbg)}
.i .n{font-size:12.5px;font-weight:600;line-height:1.25;color:var(--txt)}
.i.on .n{color:var(--grn)}
.i .r{font-size:11px;color:var(--mut);direction:ltr;font-variant-numeric:tabular-nums}
.i.add{border-style:dashed;color:var(--grn);justify-content:center;font-size:13px;font-weight:600}
.ystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.yb{flex:0 0 auto;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:600;border:1.5px solid var(--line);
    background:var(--card);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;color:var(--txt)}
.yb.on{border-color:var(--grn);background:var(--grnbg);color:var(--grn)}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block}
.head-r{font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;align-items:center}
.pr{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:340px}
.mask.c{align-items:center}
</style>
</head>

// ===== كارتير — الهيكل فقط، النِسَب يعبّيها أبو بداح من الإعدادات =====

FAMS.push(...CARTIER);

// ===== التخزين =====
const KEY = "rolexPricer.v1";
const save = (o) => { try { localStorage.setItem(KEY, JSON.stringify(o)); return true; } catch (e) { return false; } };
const load = () => { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } };

// ===== تسجيل الدخول =====
// بوابة على مستوى الواجهة فقط - القراءة/الكتابة الفعلية بقاعدة Supabase
// تستخدم مفتاح anon عام (نفس المفتاح لكل الأجهزة)، فهذي ليست حماية تشفيرية
// حقيقية، بس تمنع أي شخص عادي يفتح الرابط من التعديل أو الحذف بالخطأ.
const ACCOUNTS = {
  admin: { pass: "margin123@", role: "admin" },
  purchase: { pass: "po321321@", role: "viewer" },
};
const AUTH_KEY = "rolexPricer.auth.v2";
const loadAuth = () => { try { const r = localStorage.getItem(AUTH_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
const saveAuth = (a) => { try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch (e) {} };
const isAdmin = () => !!(auth && auth.role === "admin");
let auth = null, loginUser = "", loginPass = "", loginErr = "";
function doLogin() {
  const u = (loginUser || "").trim();
  const acc = ACCOUNTS[u];
  if (!acc || acc.pass !== loginPass) { loginErr = "Wrong username or password"; loginPass = ""; render(); return; }
  auth = { user: u, role: acc.role }; saveAuth(auth);
  loginErr = ""; loginPass = ""; render();
  startHeartbeat();
}
function logout() { stopHeartbeat(); auth = null; saveAuth(null); render(); }
function renderLogin() {
  $("app").innerHTML = `
  <div class="top"><div class="title">Rolex Calculator</div></div>
  <div class="card" style="margin-top:60px;text-align:left">
    <div style="font-weight:700;color:var(--grn);margin-bottom:14px;font-size:16px;text-align:center">Sign in</div>
    <span class="lbl">Username</span>
    <input id="loginUser" class="ltr" value="${esc(loginUser)}" oninput="loginUser=this.value" onkeydown="if(event.key==='Enter'){document.getElementById('loginPass').focus()}">
    <div style="margin-top:10px"><span class="lbl">Password</span>
    <input id="loginPass" type="password" class="ltr" value="${esc(loginPass)}" oninput="loginPass=this.value" onkeydown="if(event.key==='Enter'){doLogin()}"></div>
    ${loginErr ? `<div class="bar bad" style="margin-top:10px">${esc(loginErr)}</div>` : ""}
    <button class="save on" style="margin-top:14px" onclick="doLogin()">Log in</button>
  </div>`;
  const e = $("loginUser");
  if (e && !loginUser) e.focus(); else { const p = $("loginPass"); if (p && loginUser) p.focus(); }
}

// ===== مزامنة القواعد بين الأجهزة (Supabase) =====
// يزامن فقط "القواعد" (fams/deleted) - الأسعار المدخلة وسجل آخر ساعة محلية لكل جهاز
const SUPA_URL = "https://mfwiznrzcldcgrlzcmri.supabase.co";
const SUPA_KEY = "sb_publishable_nzUBYC-lPrEqbgbUclc7Kw_riHjoKOf";
const SUPA_HEADERS = { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` };
let lastRemoteStamp = null, syncOnline = null;

async function remoteFetch() {
  try {
    const r = await fetch(`${SUPA_URL}/rest/v1/pricing_rules?id=eq.shared&select=data,updated_at`, { headers: SUPA_HEADERS });
    if (!r.ok) { syncOnline = false; return null; }
    const rows = await r.json();
    syncOnline = true;
    return rows[0] || null;
  } catch (e) { syncOnline = false; return null; }

function applyRemoteFams(remoteData) {
  if (!remoteData || !remoteData.fams || !remoteData.fams.length) return;
  cfg.fams = remoteData.fams.map((f) => ({ ...f, items: (f.items || []).map(normItem) }));
  cfg.deleted = remoteData.deleted || [];
  // المزامنة كانت تستبدل القائمة كل ٥ ثوانٍ فتمسح أي عائلة افتراضية
  // جديدة لم تُحفظ بعد في Supabase — وهذا ما أخفى عائلات كارتير.
  // ندمج الافتراضيات غير المحذوفة بنفس منطق boot.
  for (const df of FAMS) {
    if (cfg.deleted.includes(df.id)) continue;
    const uf = cfg.fams.find((x) => x.id === df.id);
    if (!uf) { cfg.fams.push(JSON.parse(JSON.stringify(df))); continue; }
    for (const di of df.items) {
      if (cfg.deleted.includes(di.id)) continue;
      if (!uf.items.find((x) => x.id === di.id)) uf.items.push(normItem(di));
    }
  }
  save(cfg);
}
async function pollRemote(silent) {
  const row = await remoteFetch();
  // لا تصيير إن لم يتغيّر شيء: كان يُعاد بناء الصفحة كل ٥ ثوانٍ فيمسح
  // موضع سحب الشريط وهو يتصفّح. ولا شيء في الواجهة يعرض حالة الاتصال.
  if (!row || row.updated_at === lastRemoteStamp) return;
  const changed = lastRemoteStamp !== null;
  lastRemoteStamp = row.updated_at;
  applyRemoteFams(row.data);
  let f = cfg.fams.find((x) => x.id === famId) || famsOf(brand)[0] || cfg.fams[0];
  famId = f.id;
  if (!f.items.find((x) => x.id === itemId)) itemId = f.items[0].id;
  if (changed && !silent) toast("Rules updated from another device ✓");
  render();
}

    mode = "used", // "used" = مارجن مستخدم (الحساب الأصلي بعمر/قرنتي) | "new" = مارجن جديد مباشرة على السعر المدخل
    inputCur = "kwd"; // عملة الإدخال: "kwd" = دينار (الافتراضي) | "qar" = ريال. كل الحساب داخليًا بالدينار، الريال يُحوّل عند الإدخال
const normBase = { usedPct: 7, nMin: 8, nMax: 10, mMin: 8, mMax: 10, g: 80, gw: 120, w: 50, o: 50, note: "", ref: "" };
const normItem = (i) => ({ ...normBase, ...i });

function boot() {
  const s = load();
  const base = normBase;
  const norm = normItem;
  cfg = { rate: 84, curr2: "QAR", prices: {}, lastItem: null, deleted: [], fams: null };

  if (s && s.fams && s.fams.length) {
    // المحفوظ هو المرجع — يشمل ما أضافه المستخدم
    cfg.rate = s.rate ?? cfg.rate;
    cfg.curr2 = s.curr2 ?? cfg.curr2;
    cfg.prices = s.prices || {};
    cfg.lastItem = s.lastItem || null;
    cfg.deleted = s.deleted || [];
    cfg.fams = s.fams.map((f) => ({ ...f, items: (f.items || []).map(norm) }));
    // أضف أي عائلة/رفرنس افتراضي جديد لم يحذفه المستخدم ولا يملكه
    for (const df of FAMS) {
      if (cfg.deleted.includes(df.id)) continue;
      const uf = cfg.fams.find((x) => x.id === df.id);
      if (!uf) { cfg.fams.push(JSON.parse(JSON.stringify(df))); continue; }
      for (const di of df.items) {
        if (cfg.deleted.includes(di.id)) continue;
        if (!uf.items.find((x) => x.id === di.id)) uf.items.push(norm(JSON.parse(JSON.stringify(di))));
      }
    }
  } else {
    cfg.fams = JSON.parse(JSON.stringify(FAMS)).map((f) => ({ ...f, items: f.items.map(norm) }));
  }

  let f = cfg.fams[0], i = f.items[0];
  if (cfg.lastItem) for (const ff of cfg.fams) { const x = ff.items.find((y) => y.id === cfg.lastItem); if (x) { f = ff; i = x; break; } }
  famId = f.id; itemId = i.id; price = cfg.prices[i.id] || "";

// فلا يفرغ تبويب كارتير، وتبقى تعمل لو رجعت بيانات قديمة

const fmt = (n) => (n == null || isNaN(n)) ? "—" : Number(n).toLocaleString("en-US", { maximumFractionDigits: 1 });
const cardOf = (y) => y >= 2021 ? "New Card" : y >= 2016 ? "White Card" : "Olive Card";
const riyal = (k) => roundTen(k / (cfg.rate || 84) * 1000);

const qarToKwd = (q) => q / 1000 * (cfg.rate || 84);
// الحساب الداخلي كله بالدينار. هذي الدوال تعرضه بعملة الإدخال المختارة،
// فلمّا يختار المستخدم الريال لا يظهر دينار في أي مكان — طلب المالك
// ٢٠٢٦-٠٩-١٦: «مختار الريال، مفروض يطلع ريال بدون دينار ابدا».
const disp = (k) => (k == null || isNaN(k)) ? k : (inputCur === "qar" ? riyal(k) : k);
// النطاقات تحتاج تقريبًا أدق: riyal() يقرّب لأقرب ألف، فنطاق شراء
// ١,٣٩٠–١,٤٥٠ د.ك ينهار إلى ١٧,٠٠٠–١٧,٠٠٠. التقريب لأقرب مئة يُبقيه نطاقًا.
// تقريب واحد لكل شيء الآن، فـ dispR صار نفس disp. أُبقي الاسم لأن
// مواضع العرض المقارِنة (النطاقات وجدول السنوات) تناديه.
const dispR = disp;
const unit = () => inputCur === "qar" ? (cfg.curr2 || "QAR") : "KWD";
const copyLines = (sell, b) => inputCur === "qar"
  ? `Sell ${fmt(riyal(sell))} ${cfg.curr2}\nBuy ${fmt(riyal(b.lo))}–${fmt(riyal(b.hi))} ${cfg.curr2}`
  : `Sell ${fmt(sell)} KWD (${fmt(riyal(sell))} ${cfg.curr2})\nBuy ${fmt(b.lo)}–${fmt(b.hi)} KWD`;
// القيمة المدخلة محوّلة دائمًا للدينار (حسب عملة الإدخال المختارة)
const enteredKwd = () => { const v = parseFloat(price); return isNaN(v) ? NaN : (inputCur === "qar" ? qarToKwd(v) : v); };

// قاعدة التقريب المعتمدة — أقرب ١٠، للدينار والريال معًا (قرار المالك
// ٢٠٢٦-٠٩-١٦): ٤,٣٧٢ ← ٤,٣٧٠ و٤,٣٧٧ ← ٤,٣٨٠، والريال مثله ٦٢,١٠٨ ← ٦٢,١١٠.
//
// سبقتها قاعدة «٥٠ أو ٩٠» التي تسحب السعر لرقم ينتهي بـ٥٠ أو ٩٠، وكانت
// تُنتج مرشّحَين يحيطان بالرقم الخام — ومن المرشّح الثاني يُبنى زر «أو».
// بأقرب ١٠ لا يوجد مرشّح ثانٍ، فـ alt = null والزر يختفي من نفسه.
// نتيجة مقصودة للقاعدة الجديدة لا سهو.
const roundTen = (v) => Math.round(v / 10) * 10;
function roundPrice(v) { return { main: roundTen(Math.max(v, 0)), alt: null }; }
const r90 = (v) => roundTen(Math.max(v, 0));

function calc(y, p, it) {
  const lines = []; let run = p;
  const d = p * (it.usedPct / 100);
  lines.push({ t: `New → Used ${it.usedPct}%`, v: d }); run -= d;
  const seg = {}, ord = [];
  const push = (k, per, lab) => { if (!seg[k]) { seg[k] = { c: 0, per, lab }; ord.push(k); } seg[k].c++; };
  for (let x = CURRENT_YEAR; x > y; x--) {
    if (x >= 2022) push("g", it.g, "New-card years");
    else if (x === 2021) { push("g", it.g, "New-card years"); push("gw", it.gw, "Card step: New → White"); }
    else if (x >= 2016) push("w", it.w, "White-card years");
    else push("o", it.o, "Olive-card years");
  }
  for (const k of ord) {
    const s2 = seg[k], tot = s2.c * s2.per; run -= tot;
    lines.push({ t: k === "gw" ? s2.lab : `${s2.lab}: ${s2.c} × ${s2.per}`, v: tot });
  }
  const exact = Math.max(run, 0), r = roundPrice(exact);
  return { lines, exact, main: r.main, alt: r.alt };
}
const buyOf = (sell, min, max) => {
  const a = r90(sell * (1 - max / 100)), b = r90(sell * (1 - min / 100));
  return { lo: Math.min(a, b), hi: Math.max(a, b) };
};

  // كلما أراد أن يتصفّح العائلات دون أن يختار واحدة.
  if (_lastFam !== famId) {
    _lastFam = famId;
    const st = document.querySelector('[data-sk="fams"]'), on = st && st.querySelector(".f.on");
    if (st && on) {
      const l = on.offsetLeft, r = l + on.offsetWidth;
      if (l < st.scrollLeft || r > st.scrollLeft + st.clientWidth)
        st.scrollLeft = Math.max(0, l - (st.clientWidth - on.offsetWidth) / 2);
    }
  }
  window.scrollTo(0, scrollY);
}

  const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return `${s}s ago`;

  if (m < 60) return `${m}m ago`;
  return `${Math.floor(m / 60)}h ago`;
}

// ===== الكيباد =====
function key(k) {
  let v = price;
  if (k === "C") v = "";
  else if (k === "⌫") v = v.slice(0, -1);
  else if (k === ".") { if (v && !v.includes(".")) v += "."; }
  else if (v.replace(".", "").length < 8) v = (v === "0" ? "" : v) + k;
  price = v; altPick = null; persist(); render();
}
document.addEventListener("keydown", (e) => {
  const t = document.activeElement && document.activeElement.tagName;
  if (t === "INPUT" || t === "TEXTAREA") return;
  if ((e.key >= "0" && e.key <= "9") || e.key === ".") key(e.key);
  else if (e.key === "Backspace") { e.preventDefault(); key("⌫"); }
  else if (e.key === "Escape") { if (sheet) closeSheet(); else key("C"); }
});

function openRules() {
  if (!isAdmin()) return;
  const it = curItem(), f = curFam();
  draft = {
    name: it.name, ref: it.ref, note: it.note, famName: f.name,
    usedPct: String(it.usedPct),
    nMin: String(it.nMin), nMax: String(it.nMax),

    g: String(it.g), gw: String(it.gw), w: String(it.w), o: String(it.o),
    rate: String(cfg.rate), curr2: cfg.curr2,
  };
  dirty = false; saveState = null; ioMsg = ""; sheet = "rules"; render();
}
function setD(k, v) { draft[k] = v; dirty = true; saveState = null; render(); }

function saveRules() {
  if (!isAdmin() || !dirty || !draft) return;
  const n = (v, fb) => { const x = parseFloat(v); return isNaN(x) ? fb : x; };
  const it = curItem(), f = curFam();
  Object.assign(it, {
    name: (draft.name || "").trim() || it.name, ref: (draft.ref || "").trim(), note: draft.note,
    usedPct: n(draft.usedPct, it.usedPct),
    nMin: n(draft.nMin, it.nMin), nMax: n(draft.nMax, it.nMax),
    mMin: n(draft.mMin, it.mMin), mMax: n(draft.mMax, it.mMax),
    g: n(draft.g, it.g), gw: n(draft.gw, it.gw), w: n(draft.w, it.w), o: n(draft.o, it.o),
  });
  f.name = (draft.famName || "").trim() || f.name;
  cfg.rate = n(draft.rate, cfg.rate);
  cfg.curr2 = draft.curr2 || cfg.curr2;

  const wrote = save(cfg);
  let ok = false;
  if (wrote) {
    const back = load();
    const chk = back && back.fams && back.fams.map((x) => x.items).flat().find((x) => x.id === it.id);
    ok = !!(chk && Number(chk.mMin) === it.mMin && Number(chk.g) === it.g);
  }
  dirty = false; saveState = ok ? "ok" : null;
  if (!ok) ioMsg = "Could not save — copy your settings as a backup";
  render();
  if (ok) remotePush();
  setTimeout(() => { saveState = null; render(); }, 2200);
}

// ===== حذف =====
function markDeleted(id) { if (!cfg.deleted.includes(id)) cfg.deleted.push(id); }
function deleteItem() {
  if (!isAdmin()) return;
  const f = curFam(), it = curItem();
  if (f.items.length <= 1) { toast("Can’t delete the last reference in a family — delete the whole family"); return; }
  if (!confirm(`Delete "${it.name}"?`)) return;
  f.items = f.items.filter((x) => x.id !== it.id);
  markDeleted(it.id);
  delete cfg.prices[it.id];
  itemId = f.items[0].id;
  price = cfg.prices[itemId] || "";
  cfg.lastItem = itemId;
  save(cfg);
  sheet = null; render();
  toast("Reference deleted ✓");
  remotePush();
}
function deleteFam() {
  if (!isAdmin()) return;
  if (cfg.fams.length <= 1) { toast("Can’t delete the last family"); return; }
  const f = curFam();
  if (!confirm(`Delete the "${f.name}" family and all its references?`)) return;
  markDeleted(f.id);
  for (const it of f.items) { markDeleted(it.id); delete cfg.prices[it.id]; }
  cfg.fams = cfg.fams.filter((x) => x.id !== f.id);
  const nf = cfg.fams[0];
  famId = nf.id; itemId = nf.items[0].id;
  price = cfg.prices[itemId] || "";
  cfg.lastItem = itemId;
  save(cfg);
  sheet = null; render();
  toast("Family deleted ✓");
  remotePush();
}

function copyTxt(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  const a = document.createElement("textarea");
  a.value = t; a.style.position = "fixed"; a.style.opacity = "0";
  document.body.appendChild(a); a.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(a);
  return Promise.resolve();
}
function expCfg() { copyTxt(JSON.stringify(cfg)).then(() => toast("Settings copied ✓")); }
function impCfg() {
  try {
    const o = JSON.parse(ioText);
    if (!o || !o.fams) throw 0;
    localStorage.setItem(KEY, JSON.stringify(o));

}

    .then(() => toast("Copied ✓"));
}
function copyTable() {
  const it = curItem(), fam = curFam(), p = enteredKwd();
  const rows = [`${brandOf(fam)} ${fam.name} ${it.name}${it.ref ? ` (${it.ref})` : ""} — New ${fmt(disp(p))} ${unit()}`];
  for (let y = CURRENT_YEAR; y >= MIN_YEAR; y--) rows.push(`${y}: ${fmt(dispR(calc(y, p, it).main))} ${unit()}`);

}

// ── تحديث ذاتي ──────────────────────────────────────────────────────────
// المالك حافظ الحاسبة كأيقونة على شاشة جواله، وهناك لا يوجد «تحديث قسري».
// جيت‑هَب يخزّن الصفحة ١٠ دقائق، فيبقى يرى نسخة قديمة ويظن أن التعديل ما
// وصل — صار فعلًا ٢٠٢٦-٠٩-١٦. فنسأل الخادم عن رقم النسخة كلما رجع للتطبيق،
// وإن تغيّر نعيد التحميل. لا شيء يضيع: الساعة والسعر المُدخل محفوظان
// بالتخزين المحلي (persist) ويرجعان بعد التحميل، والدخول يبقى قائمًا.
// الفحص عند العودة فقط — لا مؤقّت — حتى لا تُعاد الصفحة وهو يكتب سعرًا.
const BUILD = "2026-10-21-fix3b";
let lastBuildCheck = 0;
async function checkBuild() {
  if (Date.now() - lastBuildCheck < 60000) return;   // مرة كل دقيقة على الأكثر
  lastBuildCheck = Date.now();
  try {
    const txt = await fetch(location.pathname + "?b=" + Date.now(), { cache: "no-store" }).then((r) => r.text());
    const m = txt.match(/const BUILD = "([^"]+)"/);
    if (m && m[1] !== BUILD) location.reload();
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkBuild(); });
window.addEventListener("focus", checkBuild);
